name: Trigger rebuild av samt-bu-docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sikre UUID-er i frontmatter
        run: |
          python3 .github/scripts/ensure-uuids.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Ingen endringer – alle UUID-er var på plass"
          else
            git commit -m "Auto: legg til manglende UUID-er i frontmatter [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push-forsøk $i feilet, prøver igjen..."
              sleep 3
            done
          fi

      - name: Inject lastmod i frontmatter
        run: |
          python3 .github/scripts/inject-lastmod.py
          git add content/
          if git diff --staged --quiet; then
            echo "Ingen lastmod-endringer"
          else
            git commit -m "Auto: oppdater lastmod i frontmatter [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push-forsøk $i feilet, prøver igjen..."
              sleep 3
            done
          fi

      - name: Send repository_dispatch til samt-bu-docs
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n --arg source 'samt-bu-drafts' --arg msg "$COMMIT_MSG" '{event_type:"module-updated",client_payload:{source:$source,message:$msg}}')
          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.DOCS_REBUILD_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/SAMT-X/samt-bu-docs/dispatches \
            --data "$PAYLOAD")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/dispatch_response.json
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "FEIL: dispatch feilet med status $HTTP_STATUS – sjekk at DOCS_REBUILD_TOKEN har workflow-scope og tilgang til samt-bu-docs"
            exit 1
          fi
          echo "Dispatch sendt OK"
